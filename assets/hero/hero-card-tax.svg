<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="380" height="500">
  <defs>
    <filter id="shadowTax" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f2936" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f7091" flood-opacity="0.04"/>
    </filter>
    <linearGradient id="taxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2995C3"/>
      <stop offset="100%" stop-color="#1F7091"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="360" height="475" rx="24" fill="#FFFFFF" stroke="#D7E7F0" stroke-width="1.5" filter="url(#shadowTax)"/>

  <!-- Category Pill -->
  <rect x="32" y="36" width="168" height="26" rx="13" fill="#EBF5FA"/>
  <text x="44" y="53" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1F7091" letter-spacing="0.08em">TAX &amp; FEDERAL FILINGS</text>

  <!-- Form 5472 / Corp Tax Box -->
  <rect x="32" y="80" width="316" height="68" rx="12" fill="#F8FBFE" stroke="#E6EFF5" stroke-width="1.5"/>
  <!-- File Icon -->
  <g transform="translate(48, 98)" stroke="#1F7091" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
  </g>
  <text x="84" y="108" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F2936">Form 5472 / Corp Tax</text>
  <text x="84" y="128" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4A6572">Foreign-Owned LLC &amp; UK HMRC Compliance</text>

  <!-- Radial Progress Section -->
  <g transform="translate(32, 175)">
    <!-- Radial Gauge -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#EBF3F8" stroke-width="8"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#taxGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="232 264" transform="rotate(-90 50 50)"/>
    <text x="50" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F2936">88%</text>
    <text x="50" y="63" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7E97A6" letter-spacing="0.05em">READY</text>

    <!-- Meta Details beside Gauge -->
    <rect x="116" y="20" width="132" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="126" y="36" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">✓ Verified by CPA</text>

    <text x="116" y="66" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#4A6572">Status: <tspan font-weight="700" fill="#0F2936">On Schedule</tspan></text>
    <text x="116" y="84" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1F7091">• Annual Filing</text>
  </g>

  <!-- Progress Steps Timeline -->
  <g transform="translate(32, 310)">
    <line x1="16" y1="20" x2="16" y2="80" stroke="#D7E7F0" stroke-width="2"/>
    
    <circle cx="16" cy="20" r="10" fill="#10B981"/>
    <text x="16" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">✓</text>
    <text x="36" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0F2936">Officer ID Verification Complete</text>

    <circle cx="16" cy="75" r="10" fill="#EBF5FA" stroke="#2995C3" stroke-width="2"/>
    <circle cx="16" cy="75" r="4" fill="#1F7091"/>
    <text x="36" y="79" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1F7091">Annual Information Schedule Active</text>
  </g>

  <!-- Divider & Footer -->
  <line x1="32" y1="435" x2="348" y2="435" stroke="#E6EFF5" stroke-width="1.5"/>
  <text x="32" y="458" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F7091">HMRC &amp; IRS Deadlines Monitored</text>
  <circle cx="340" cy="454" r="4" fill="#10B981"/>
</svg>