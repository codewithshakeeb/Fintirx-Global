<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <filter id="shadowTracker" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f7091" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2936" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="400" height="495" rx="26" fill="#FFFFFF" stroke="#2995C3" stroke-width="2.5" filter="url(#shadowTracker)"/>

  <!-- Header Row: Eyebrow + Status Badge -->
  <text x="36" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#1F7091" letter-spacing="0.08em">FORMATION TRACKER</text>
  <text x="36" y="76" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F2936">Apex Frontier LLC / UK LTD</text>

  <!-- Filing In Progress Pill -->
  <rect x="254" y="32" width="130" height="28" rx="14" fill="#EBF5FA" stroke="#D7E7F0" stroke-width="1"/>
  <circle cx="270" cy="46" r="4" fill="#2995C3"/>
  <text x="282" y="50" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1F7091">Filing In Progress</text>

  <!-- 4-Step Vertical Tracker -->
  <g transform="translate(36, 110)">
    <!-- Connecting Line -->
    <line x1="16" y1="20" x2="16" y2="250" stroke="#E6EFF5" stroke-width="2"/>

    <!-- Step 1: Done -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="14" fill="#10B981"/>
      <text x="16" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">✓</text>
      <text x="44" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0F2936">Account &amp; Jurisdiction Setup</text>
      <text x="44" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#4A6572">Wyoming Division of Corporations / Companies House</text>
    </g>

    <!-- Step 2: In Progress -->
    <g transform="translate(0, 75)">
      <circle cx="16" cy="16" r="14" fill="#EBF5FA" stroke="#2995C3" stroke-width="2"/>
      <!-- Spinner Arc -->
      <path d="M 16,6 A 10,10 0 0,1 26,16" fill="none" stroke="#1F7091" stroke-width="3" stroke-linecap="round"/>
      <text x="44" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1F7091">Articles of Organization Submitted</text>
      <text x="44" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#4A6572">State / Companies House queue active (Est. 24h)</text>
    </g>

    <!-- Step 3: Queued 3 -->
    <g transform="translate(0, 150)">
      <circle cx="16" cy="16" r="14" fill="#F8FAFC" stroke="#D7E7F0" stroke-width="1.5"/>
      <text x="16" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B">3</text>
      <text x="44" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0F2936">Registered Agent Assigned</text>
      <text x="44" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#4A6572">Physical in-state address confirmed or UK Office</text>
    </g>

    <!-- Step 4: Queued 4 -->
    <g transform="translate(0, 225)">
      <circle cx="16" cy="16" r="14" fill="#F8FAFC" stroke="#D7E7F0" stroke-width="1.5"/>
      <text x="16" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B">4</text>
      <text x="44" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0F2936">IRS EIN / Tax Registration</text>
      <text x="44" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#4A6572">Application prepared for dispatch</text>
    </g>
  </g>

  <!-- Divider & Footer -->
  <line x1="36" y1="445" x2="384" y2="445" stroke="#E6EFF5" stroke-width="1.5"/>
  <text x="36" y="472" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4A6572">Live Portal Sync: <tspan font-weight="800" fill="#0F2936">Active</tspan></text>
  <rect x="310" y="458" width="74" height="22" rx="11" fill="#DCFCE7"/>
  <text x="323" y="473" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#15803D">EXPEDITE</text>
</svg>